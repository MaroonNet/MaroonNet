[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcm"
version = "0.1.0"
description = "MaroonNet Mesh Connectivity Map: the radio record, gateway, airtime, coverage, and simulation"
readme = "README.md"
# 3.11 for tomllib (the radio profile is TOML) and datetime.UTC. The root project asks for 3.12.
requires-python = ">=3.11"
# No runtime dependencies. The radio library is optional so the contract, the airtime math, the
# synthetic feed, and the tests install and run anywhere, with no radio.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# The gateway's radio I/O. Pin to the version recorded in configs/radio_profile.toml once the
# firmware is pinned (MCM v1.1 section 6.3; contract C-08). Unpinned until then on purpose.
radio = ["meshtastic"]
# Terrain for the coverage model (MCM v1.1 section 6.4). Added when the elevation step is built.
geo = ["numpy>=1.24", "rasterio>=1.3"]

[project.scripts]
mcm = "mcm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Inherit the root lint rules (line length 100, E F I B UP N) and tell isort that mcm is
# first-party, so `ruff check .` from the repository root and from mcm/ agree.
extend = "../pyproject.toml"
src = ["src", "tests"]
