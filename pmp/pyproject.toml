[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmp"
version = "0.1.0"
description = "MaroonNet (Pre)Mission Planning: the command post, the bridge daemon, the plan, and the maps"
readme = "README.md"
# 3.11 to match mcm/ (tomllib, datetime.UTC). The root project asks for 3.12.
requires-python = ">=3.11"
# No runtime dependencies. Phase 0 is stubs and contract drafts, so the package installs and its
# tests run anywhere. The framework (R-03) and the map library (R-10) are research items; nothing
# here picks them.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# The terrain package (C-05) and sector geometry. Added when maps/ and planning/ grow bodies.
geo = ["shapely>=2.0", "rasterio>=1.3", "pyproj>=3.5"]

[project.scripts]
pmp = "pmp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# Without this, setuptools also registers src/claude/ and src/archive/ as top-level packages.
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Inherit the root lint rules (line length 100, E F I B UP N) and tell isort that pmp is
# first-party, so `ruff check .` from the repository root and from pmp/ agree.
extend = "../pyproject.toml"
src = ["src", "tests"]
