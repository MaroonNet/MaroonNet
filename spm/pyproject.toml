[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spm"
version = "0.1.0"
description = "MaroonNet Sector Probability Mapping: lost-person probability surfaces and their evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyproj>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Added in step 3 (terrain stacks). Kept out of the core install so step 1 installs anywhere.
geo = ["rasterio>=1.3", "rioxarray>=0.15", "geopandas>=0.14", "shapely>=2.0", "pyrosm>=0.6"]
# Added in the ML phase.
ml = ["torch>=2.2"]

[project.scripts]
spm = "spm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
