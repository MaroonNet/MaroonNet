# Published terrain multipliers for the prior-art (Bayesian combination) model.
#
# Each feature is cut into bins by `edges` (len(edges)+1 bins; the last bin is
# open-ended). `multipliers` says how much more (>1) or less (<1) likely a find
# is in that bin compared with an average cell at the same distance from the IPP.
#
# The bins are what matters now: the learned hybrid uses the same bins and
# starts from these values. Leave a multiplier list blank (null) until someone
# has typed it in from the source with a page/table number. Blank features are
# skipped by the prior-art model and start at 1.0 (no effect) in the hybrid.
#
# DO NOT invent values. Every filled list needs `source` with page/table.

features:
  dist_trail_m:
    edges: [20, 50, 100, 200, 500]
    multipliers: null
    source: "Jacobs 2015, Terrain Based Probability Models for SAR (MRA), trail PDEN by offset: Table __, p. __"

  dist_road_m:
    edges: [20, 50, 100, 200, 500]
    multipliers: null
    source: "Jacobs 2015, road PDEN by offset: Table __, p. __"

  dist_stream_m:
    edges: [20, 50, 100, 200, 500]
    multipliers: null
    source: "Jacobs 2015, drainage/stream PDEN by offset: Table __, p. __"

  elev_change_m:
    # downhill <-> uphill from the IPP, metres
    edges: [-300, -100, -30, 30, 100, 300]
    multipliers: null
    source: "Koester 2008 (Lost Person Behavior) elevation change tables by category, or Jacobs 2015 relative elevation: __"

  same_watershed:
    # bin 0 = different watershed, bin 1 = IPP's watershed
    edges: [0.5]
    multipliers: null
    source: "Doke 2012 / Sava et al. 2016 watershed model: __"
