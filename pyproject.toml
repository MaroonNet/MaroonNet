[project]
name = "maroonnet"
version = "0.0.1"
description = "Offline SAR mesh command post on Meshtastic: live POD, terrain-aware coverage, topology risk, replay, CalTopo interop."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
# Add runtime deps in Sprint 1 with exact pins, e.g. "meshtastic==2.x.y", "fastapi==0.x.y",
# "uvicorn==0.x.y", "numpy==2.x.y", "shapely==2.x.y", "networkx==3.x". The Backend Lead owns
# dependency changes (chore/deps-* PRs). uv.lock is committed and is the exact-pin record.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hardware: requires a Meshtastic gateway node connected over USB (deselected in CI)",
]
addopts = "-m 'not hardware'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maroonnet"]
