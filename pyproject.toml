[project]
name = "maroonnet"
version = "0.0.1"
description = "Location tracking, logging, and after-action replay for Search & Rescue over LoRa/Meshtastic mesh."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
